# OS
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_HEAP_MEM_POOL_SIZE=16

# CPP library
CONFIG_CPP=y

# Silicon Labs Openthread Settings
CONFIG_NET_L2_OPENTHREAD=n
CONFIG_SILABS_SISDK_OPENTHREAD_EFR32=y

CONFIG_SILABS_SISDK_RAIL_MULTIPROTOCOL=y
# CONFIG_SIZE_OPTIMIZATIONS=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_STACK_SIZE=5120

# Enable OpenThread features set
CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y
CONFIG_OPENTHREAD_SHELL=y


# CONFIG_ZEPHYR_PICOLIBC_MODULE=n
# CONFIG_HAS_SEGGER_RTT=n